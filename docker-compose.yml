services:
  db:
    image: postgres:17-alpine
    container_name: heliogoiano-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: heliogoiano
      POSTGRES_PASSWORD: heliogoiano_dev
      POSTGRES_DB: heliogoiano
    ports:
      - "5433:5432"
    volumes:
      - heliogoiano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heliogoiano -d heliogoiano"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  heliogoiano_pgdata:
